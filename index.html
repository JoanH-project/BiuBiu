<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIUBIU</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background:
        radial-gradient(circle at 50% 45%, rgba(56, 189, 248, 0.18), transparent 32%),
        radial-gradient(circle at center, #111827, #020617 70%);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      color: white;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: 100%;
      text-align: center;
      position: relative;
    }

    .title {
      margin-bottom: 34px;
      font-size: 24px;
      letter-spacing: 4px;
      font-weight: 700;
      color: #e0f2fe;
      text-shadow: 0 0 18px rgba(56, 189, 248, 0.7);
    }

    .launcher-area {
      position: relative;
      width: 520px;
      height: 260px;
      margin: 0 auto;
    }

    .launcher {
      position: absolute;
      left: 52px;
      top: 72px;
      width: 360px;
      height: 130px;
      cursor: pointer;
      user-select: none;
      transform-origin: 90px 60px;
      transition: transform 0.08s ease;
      filter: drop-shadow(0 18px 26px rgba(0, 0, 0, 0.45));
    }

    .launcher:active {
      transform: translateX(-6px) rotate(-1.5deg);
    }

    .top-rail {
      position: absolute;
      left: 78px;
      top: 0;
      width: 170px;
      height: 18px;
      background: linear-gradient(180deg, #475569, #1e293b);
      clip-path: polygon(8% 0, 100% 0, 92% 100%, 0 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.25);
    }

    .main-body {
      position: absolute;
      left: 50px;
      top: 24px;
      width: 230px;
      height: 58px;
      background: linear-gradient(180deg, #334155, #0f172a);
      clip-path: polygon(0 18%, 72% 0, 100% 28%, 94% 100%, 8% 100%);
      border: 1px solid rgba(148, 163, 184, 0.55);
      box-shadow:
        inset 0 8px 12px rgba(255, 255, 255, 0.08),
        inset 0 -10px 18px rgba(0, 0, 0, 0.45),
        0 0 28px rgba(14, 165, 233, 0.18);
    }

    .rear {
      position: absolute;
      left: 16px;
      top: 38px;
      width: 62px;
      height: 38px;
      background: linear-gradient(180deg, #1e293b, #020617);
      clip-path: polygon(0 18%, 86% 0, 100% 70%, 22% 100%);
      border: 1px solid rgba(148, 163, 184, 0.45);
    }

    .barrel {
      position: absolute;
      left: 265px;
      top: 36px;
      width: 90px;
      height: 34px;
      background: linear-gradient(180deg, #475569, #111827);
      clip-path: polygon(0 18%, 88% 18%, 100% 50%, 88% 82%, 0 82%);
      border-top: 1px solid rgba(255, 255, 255, 0.22);
      border-bottom: 1px solid rgba(0, 0, 0, 0.75);
    }

    .muzzle {
      position: absolute;
      left: 344px;
      top: 39px;
      width: 32px;
      height: 28px;
      background: radial-gradient(circle, #0ea5e9 0%, #020617 38%, #020617 100%);
      border-radius: 4px 14px 14px 4px;
      border: 1px solid rgba(125, 211, 252, 0.55);
      box-shadow: inset 0 0 14px rgba(56, 189, 248, 0.65);
    }

    .energy-core {
      position: absolute;
      left: 142px;
      top: 34px;
      width: 44px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle, #e0f2fe 0%, #38bdf8 26%, #0284c7 48%, #0f172a 70%);
      box-shadow:
        0 0 14px rgba(56, 189, 248, 0.9),
        0 0 34px rgba(14, 165, 233, 0.55);
    }

    .energy-line {
      position: absolute;
      left: 190px;
      top: 48px;
      width: 88px;
      height: 6px;
      background: linear-gradient(90deg, #38bdf8, transparent);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.9);
    }

    .grip {
      position: absolute;
      left: 108px;
      top: 74px;
      width: 56px;
      height: 88px;
      background: linear-gradient(105deg, #111827, #020617);
      clip-path: polygon(12% 0, 92% 0, 78% 100%, 0 100%);
      border: 1px solid rgba(148, 163, 184, 0.45);
      box-shadow: inset -8px 0 12px rgba(255, 255, 255, 0.06);
    }

    .grip::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 14px;
      width: 28px;
      height: 58px;
      background: repeating-linear-gradient(
        180deg,
        rgba(148, 163, 184, 0.35) 0,
        rgba(148, 163, 184, 0.35) 3px,
        transparent 3px,
        transparent 11px
      );
      opacity: 0.55;
    }

    .trigger-guard {
      position: absolute;
      left: 162px;
      top: 74px;
      width: 52px;
      height: 42px;
      border: 7px solid #1e293b;
      border-top: none;
      border-radius: 0 0 26px 26px;
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.45);
    }

    .trigger {
      position: absolute;
      left: 180px;
      top: 78px;
      width: 10px;
      height: 30px;
      background: linear-gradient(180deg, #64748b, #0f172a);
      border-radius: 8px;
      transform: rotate(7deg);
    }

    .flash {
      position: absolute;
      left: 404px;
      top: 82px;
      width: 0;
      height: 0;
      pointer-events: none;
      opacity: 0;
    }

    .flash.active {
      animation: muzzleFlash 0.18s ease-out forwards;
    }

    .flash::before {
      content: "";
      position: absolute;
      left: 0;
      top: -22px;
      width: 96px;
      height: 44px;
      background: radial-gradient(circle at left, #ffffff 0%, #fde68a 20%, #38bdf8 42%, transparent 72%);
      clip-path: polygon(0 50%, 22% 10%, 38% 36%, 100% 50%, 38% 64%, 22% 90%);
      filter: blur(0.2px);
    }

    @keyframes muzzleFlash {
      0% {
        opacity: 1;
        transform: scaleX(0.45);
      }
      100% {
        opacity: 0;
        transform: scaleX(1.25);
      }
    }

    .beam {
      position: absolute;
      left: 404px;
      top: 101px;
      width: 240px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(90deg, #e0f2fe, #38bdf8, transparent);
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.95);
      opacity: 0;
      pointer-events: none;
    }

    .beam.active {
      animation: beamMove 0.22s ease-out forwards;
    }

    @keyframes beamMove {
      0% {
        opacity: 1;
        transform: scaleX(0.2);
      }
      100% {
        opacity: 0;
        transform: translateX(120px) scaleX(1);
      }
    }

    .particle {
      position: absolute;
      left: 405px;
      top: 96px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e0f2fe;
      box-shadow: 0 0 12px #38bdf8;
      pointer-events: none;
      animation: particleFly 0.5s ease-out forwards;
    }

    @keyframes particleFly {
      0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
      }
      100% {
        transform: translate(var(--x), var(--y)) scale(0.2);
        opacity: 0;
      }
    }

    .biu-text {
      position: absolute;
      left: 430px;
      top: 64px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #e0f2fe;
      text-shadow: 0 0 14px #38bdf8, 0 0 28px #0ea5e9;
      pointer-events: none;
      animation: textFly 0.55s ease-out forwards;
    }

    @keyframes textFly {
      0% {
        transform: translateX(0) scale(0.8);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateX(180px) translateY(-22px) scale(1.2);
        opacity: 0;
      }
    }

    .screen-flash {
      position: fixed;
      inset: 0;
      background: rgba(125, 211, 252, 0.35);
      opacity: 0;
      pointer-events: none;
    }

    .screen-flash.active {
      animation: screenFlash 0.16s ease-out;
    }

    @keyframes screenFlash {
      0% {
        opacity: 0.28;
      }
      100% {
        opacity: 0;
      }
    }

    .hint {
      margin-top: 28px;
      color: #bae6fd;
      opacity: 0.78;
      font-size: 15px;
      letter-spacing: 1px;
    }

    @media (max-width: 640px) {
      .launcher-area {
        transform: scale(0.72);
        margin-top: -20px;
        margin-bottom: -30px;
      }

      .title {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">BIUBIU LAUNCHER</div>

    <div class="launcher-area" id="area">
      <div class="launcher" onclick="fireBiu()">
        <div class="top-rail"></div>
        <div class="rear"></div>
        <div class="main-body"></div>
        <div class="energy-core" id="core"></div>
        <div class="energy-line"></div>
        <div class="barrel"></div>
        <div class="muzzle"></div>
        <div class="grip"></div>
        <div class="trigger-guard"></div>
        <div class="trigger"></div>
      </div>

      <div class="flash" id="flash"></div>
      <div class="beam" id="beam"></div>
    </div>

    <div class="hint">点击发射器，触发能量</div>
  </div>

  <div class="screen-flash" id="screenFlash"></div>

  <script>
    let audioCtx;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();
      }
      return audioCtx;
    }

    function playBiuSound() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;

      const master = ctx.createGain();
      master.gain.setValueAtTime(0.32, now);
      master.connect(ctx.destination);

      const impact = ctx.createOscillator();
      const impactGain = ctx.createGain();

      impact.type = "sawtooth";
      impact.frequency.setValueAtTime(95, now);
      impact.frequency.exponentialRampToValueAtTime(42, now + 0.09);

      impactGain.gain.setValueAtTime(0.001, now);
      impactGain.gain.exponentialRampToValueAtTime(0.5, now + 0.01);
      impactGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      impact.connect(impactGain);
      impactGain.connect(master);

      impact.start(now);
      impact.stop(now + 0.13);

      const laser = ctx.createOscillator();
      const laserGain = ctx.createGain();

      laser.type = "square";
      laser.frequency.setValueAtTime(1250, now + 0.02);
      laser.frequency.exponentialRampToValueAtTime(2600, now + 0.1);
      laser.frequency.exponentialRampToValueAtTime(720, now + 0.2);

      laserGain.gain.setValueAtTime(0.001, now + 0.02);
      laserGain.gain.exponentialRampToValueAtTime(0.26, now + 0.035);
      laserGain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);

      laser.connect(laserGain);
      laserGain.connect(master);

      laser.start(now + 0.02);
      laser.stop(now + 0.23);

      const tail = ctx.createOscillator();
      const tailGain = ctx.createGain();

      tail.type = "triangle";
      tail.frequency.setValueAtTime(1800, now + 0.12);
      tail.frequency.exponentialRampToValueAtTime(3600, now + 0.22);

      tailGain.gain.setValueAtTime(0.001, now + 0.12);
      tailGain.gain.exponentialRampToValueAtTime(0.16, now + 0.14);
      tailGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      tail.connect(tailGain);
      tailGain.connect(master);

      tail.start(now + 0.12);
      tail.stop(now + 0.3);
    }

    function restartAnimation(el, className) {
      el.classList.remove(className);
      void el.offsetWidth;
      el.classList.add(className);
    }

    function fireBiu() {
      playBiuSound();

      const flash = document.getElementById("flash");
      const beam = document.getElementById("beam");
      const screenFlash = document.getElementById("screenFlash");
      const area = document.getElementById("area");

      restartAnimation(flash, "active");
      restartAnimation(beam, "active");
      restartAnimation(screenFlash, "active");

      if (navigator.vibrate) {
        navigator.vibrate([35, 20, 45]);
      }

      const text = document.createElement("div");
      text.className = "biu-text";
      text.textContent = "BIU";
      area.appendChild(text);

      setTimeout(() => {
        text.remove();
      }, 550);

      for (let i = 0; i < 16; i++) {
        const p = document.createElement("div");
        p.className = "particle";

        const x = 120 + Math.random() * 180;
        const y = -50 + Math.random() * 100;

        p.style.setProperty("--x", x + "px");
        p.style.setProperty("--y", y + "px");
        area.appendChild(p);

        setTimeout(() => {
          p.remove();
        }, 500);
      }
    }
  </script>
</body>
</html>
